<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="grad1" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring (Globe Meridian) -->
  <circle cx="128" cy="128" r="88" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner Web Latitude / Longitude Arcs -->
  <ellipse cx="128" cy="128" rx="42" ry="88" stroke="url(#grad2)" stroke-width="8" stroke-dasharray="14 8" stroke-linecap="round"/>
  <line x1="40" y1="128" x2="216" y2="128" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Extraction Node / Pin -->
  <circle cx="128" cy="128" r="22" fill="#FFFFFF" stroke="url(#grad1)" stroke-width="8"/>
  <circle cx="128" cy="128" r="8" fill="#6366F1"/>

  <!-- Scanning / Scraping Ray Accent -->
  <path d="M 128 40 L 160 72 M 128 40 L 96 72" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"/>
</svg>
